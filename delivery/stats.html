<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>배송 없는 일주일 현황판</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* 레이아웃: 위에 숫자 네 개, 아래로 한 단짜리 막대 목록. 막대는 한 가지 색(크기 비교), 글자는 늘 잉크색. */
:root{
  --paper:#F2F1EF; --surface:#FBFAF9; --ink:#231F20; --muted:#5E5A5B; --line:#D5D1D1; --bar:#A83D5F; --track:#E6E3E2;
  --sans:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --mono:'IBM Plex Mono','Noto Sans KR',ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --paper:#1A1718; --surface:#252122; --ink:#EFEDEA; --muted:#ABA6A7; --line:#443E40; --bar:#E0779A; --track:#332E30; color-scheme:dark }
}
:root[data-theme="dark"]{ --paper:#1A1718; --surface:#252122; --ink:#EFEDEA; --muted:#ABA6A7; --line:#443E40; --bar:#E0779A; --track:#332E30; color-scheme:dark }
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;word-break:keep-all}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:24px 56px;display:flex;flex-direction:column;gap:22px}
h1,h2,p{margin:0}
h1{font-size:24px;font-weight:900;letter-spacing:-.01em}
h2{font-size:16px;font-weight:900}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding-bottom:12px;border-bottom:2px solid var(--ink)}
.sub{font-size:13px;color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--bar);outline-offset:2px}
.btn{min-height:44px;padding:8px 16px;border:2px solid var(--ink);border-radius:10px;background:var(--ink);color:var(--paper);font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.gate{display:flex;flex-direction:column;gap:12px;padding:20px 18px;border:2px solid var(--ink);border-radius:14px;background:var(--surface);max-width:420px}
.gate input[type=password]{min-height:44px;padding:8px 12px;border:2px solid var(--ink);border-radius:10px;background:var(--paper);flex:1 1 160px;min-width:0}
.gate label.keep{font-size:14px;display:flex;gap:8px;align-items:center}
.msg{font-size:14px;font-weight:700;color:var(--bar);min-height:1.6em}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:620px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-top:3px solid var(--ink);background:var(--surface);border-radius:0 0 10px 10px}
.tile span{font-size:13px;color:var(--muted)}
.tile b{font-family:var(--mono);font-size:32px;font-weight:500;line-height:1.15}
.tile b small{font-family:var(--sans);font-size:14px;font-weight:700;margin-left:2px}
.tile em{font-style:normal;font-size:13px;color:var(--muted)}
.panel{display:flex;flex-direction:column;gap:10px}
.panel > p{font-size:13px;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:2px}
.bar-row{display:grid;grid-template-columns:minmax(96px,9.5em) minmax(0,1fr) auto;align-items:center;gap:10px;padding:5px 6px;border-radius:6px}
.bar-row:hover{background:var(--surface)}
.bar-row .lab{font-size:14px;font-weight:700;min-width:0}
.bar-row .lab small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.bar-row .trk{height:14px;background:var(--track);border-radius:0 4px 4px 0;overflow:hidden}
.bar-row .trk i{display:block;height:100%;background:var(--bar);border-radius:0 4px 4px 0;min-width:0}
.bar-row .val{font-family:var(--mono);font-size:14px;text-align:right;min-width:4.5em}
.bar-row .val small{font-family:var(--sans);color:var(--muted);font-size:12px;margin-left:4px}
#board{display:flex;flex-direction:column;gap:28px}
.empty{padding:18px;border:2px dashed var(--line);border-radius:12px;color:var(--muted)}
.foot{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div><h1>배송 없는 일주일 현황판</h1><p class="sub" id="stamp">암호를 넣으면 지금까지 쌓인 결과가 보입니다.</p></div>
    <div class="row" id="tools" hidden><button class="btn ghost" id="reload">새로 고침</button><button class="btn ghost" id="forget">암호 지우기</button></div>
  </div>

  <form class="gate" id="gate">
    <h2><label for="code">현황판 암호</label></h2>
    <div class="row"><input type="password" id="code" autocomplete="current-password" required><button class="btn" type="submit">보기</button></div>
    <label class="keep"><input type="checkbox" id="keep"> 이 기기에서 기억하기</label>
    <p class="msg" id="msg" role="status"></p>
  </form>

  <div id="board" hidden></div>
  <p class="foot">한 줄이 한 사람(브라우저 하나)의 첫 판입니다. 같은 사람이 다시 한 판은 세지 않습니다.</p>
</div>

<script>
const SB = { url: 'https://zwgqgbbsmobdvxsvtfdj.supabase.co', key: 'sb_publishable_TPy3C1sjZyg69L9YlWvfsQ_3sceHlJD' };
const SCENES = [['월', '빈 현관'], ['월', '장보기'], ['화', '휴지'], ['수', '야식'], ['목', '선물'], ['금', '금요일 저녁'], ['토', '16킬로그램'], ['토', '빈 오후'], ['일', '일주일 치 목록']];
const WHY = { T: '시간에 쫓겨', E: '몸이 지쳐', M: '불안을 못 이겨' };
const FINAL = { all: '전처럼 다 주문한다', some: '필요한 것만 주문한다', off: '하루 더 버텨 본다' };
const STORE = { kyobo: '교보문고', yes24: '예스24', aladin: '알라딘' };
const TIERS = [[85, '뼛속까지 호모 딜리버리쿠스', '85% 이상'], [60, '꽤 호모 딜리버리쿠스', '60~84%'], [35, '반쯤 호모 딜리버리쿠스', '35~59%'], [0, '아직은 제 발로 움직이는 인간', '34% 이하']];
const $ = id => document.getElementById(id);
const n0 = n => Number(n || 0).toLocaleString('ko-KR');
const share = (n, t) => t ? Math.round(n / t * 100) : 0;
const store = { get() { try { return localStorage.getItem('hd_admin_code') || sessionStorage.getItem('hd_admin_code') || ''; } catch (e) { return ''; } },
  set(v, keep) { try { sessionStorage.setItem('hd_admin_code', v); if (keep) localStorage.setItem('hd_admin_code', v); else localStorage.removeItem('hd_admin_code'); } catch (e) {} },
  clear() { try { sessionStorage.removeItem('hd_admin_code'); localStorage.removeItem('hd_admin_code'); } catch (e) {} } };

async function fetchStats(code) {
  const r = await fetch(`${SB.url}/rest/v1/rpc/hd_stats`, { method: 'POST',
    headers: { apikey: SB.key, Authorization: `Bearer ${SB.key}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ p_code: code }) });
  if (!r.ok) throw new Error('연결 오류 ' + r.status);
  return r.json();
}

/* 막대 목록: rows = [{label, sub, n, note}] · 막대 길이는 목록 안 최댓값 기준, 숫자와 비율은 늘 글자로 함께 적음 */
function bars(rows, total, unit) {
  const max = Math.max(1, ...rows.map(r => r.n));
  return `<div class="bars">${rows.map(r => `<div class="bar-row" title="${r.label}: ${n0(r.n)}${unit} (${share(r.n, total)}%)">
    <span class="lab">${r.label}${r.sub ? `<small>${r.sub}</small>` : ''}</span>
    <span class="trk"><i style="width:${r.n / max * 100}%"></i></span>
    <span class="val num">${n0(r.n)}<small>${share(r.n, total)}%</small></span></div>`).join('')}</div>`;
}
function panel(title, note, body) { return `<section class="panel"><h2>${title}</h2>${note ? `<p>${note}</p>` : ''}${body}</section>`; }

function render(d) {
  const T = d.total, sum = a => a.reduce((x, y) => x + y.n, 0);
  $('stamp').textContent = d.last ? `마지막 참여 ${new Date(d.last).toLocaleString('ko-KR', { dateStyle: 'medium', timeStyle: 'short' })} · 조회 ${new Date().toLocaleTimeString('ko-KR', { timeStyle: 'short' })}` : '아직 참여 기록이 없습니다.';
  const clicks = sum(d.clicks);
  let html = `<div class="tiles">
    <div class="tile"><span>참여자</span><b>${n0(T)}<small>명</small></b><em>브라우저 기준</em></div>
    <div class="tile"><span>일주일 완주</span><b>${n0(d.done)}<small>명</small></b><em>참여자의 ${share(d.done, T)}%</em></div>
    <div class="tile"><span>평균 배송 의존도</span><b>${n0(d.avg_pct)}<small>%</small></b><em>낮을수록 오래 버팀</em></div>
    <div class="tile"><span>서점 버튼 클릭</span><b>${n0(clicks)}<small>번</small></b><em>참여자 100명당 ${T ? Math.round(clicks / T * 100) : 0}번</em></div>
  </div>`;
  if (!T) { $('board').innerHTML = html + '<p class="empty">아직 쌓인 결과가 없습니다. 누군가 한 판을 끝내면 여기에 나타납니다.</p>'; return; }

  const at = SCENES.map((s, i) => { const q = sum(d.ends.filter(e => e.end_type === 'quit' && e.scene === i)), f = sum(d.ends.filter(e => e.end_type === 'forced' && e.scene === i));
    return { label: s[1], sub: `${s[0]} · 주문 ${n0(q)} · 못 버팀 ${n0(f)}`, n: q + f }; });
  at.push({ label: '완주', sub: '일주일을 끝까지 버팀', n: d.done });
  html += panel('어디서 끝났나', '장면이 나오는 순서대로입니다. 그 장면에서 실험이 끝난 사람 수이고, 작은 글씨는 스스로 주문한 사람과 버티지 못한 사람입니다.', bars(at, T, '명'));

  const forced = sum(d.ends.filter(e => e.end_type === 'forced'));
  html += panel('버티지 못한 이유', `스스로 주문하지 않았는데 끝난 ${n0(forced)}명의 이유입니다.`,
    bars(['M', 'T', 'E'].map(k => ({ label: WHY[k], n: sum(d.ends.filter(e => e.end_type === 'forced' && e.meter === k)) })), forced, '명'));

  html += panel('버틴 날', '', bars(Array.from({ length: 8 }, (_, k) => ({ label: k === 7 ? '7일(완주)' : `${k}일`, n: (d.days.find(x => x.days === k) || { n: 0 }).n })), T, '명'));

  html += panel('배송 의존도 등급', '', bars(TIERS.map(([lo, name, range], i) => ({ label: name, sub: range,
    n: sum(d.pcts.filter(x => x.pct >= lo && (i === 0 || x.pct < TIERS[i - 1][0]))) })), T, '명'));

  html += panel('완주한 뒤의 선택', `완주한 ${n0(d.done)}명이 자정에 고른 것입니다.`,
    bars(['all', 'some', 'off'].map(k => ({ label: FINAL[k], n: sum(d.ends.filter(e => e.end_type === 'done' && e.final === k)) })), d.done, '명'));

  html += panel('날짜별 참여', '한국 시간 기준입니다.', bars(d.dates.map(x => ({ label: x.d.slice(5).replace('-', '월 ') + '일', n: x.n })), T, '명'));

  html += panel('서점별 클릭', '결과 화면의 서점 버튼이 눌린 횟수입니다. 한 사람이 여러 번 누르면 그만큼 셉니다.',
    bars(['kyobo', 'yes24', 'aladin'].map(k => ({ label: STORE[k], n: (d.clicks.find(x => x.store === k) || { n: 0 }).n })), clicks, '번'));
  $('board').innerHTML = html;
}

async function load(code, fromForm) {
  $('msg').textContent = '불러오는 중입니다.';
  try {
    const d = await fetchStats(code);
    if (!d) { store.clear(); $('gate').hidden = false; $('board').hidden = true; $('tools').hidden = true; $('msg').textContent = '암호가 맞지 않습니다.'; return; }
    if (fromForm) store.set(code, $('keep').checked);
    $('msg').textContent = ''; $('gate').hidden = true; $('board').hidden = false; $('tools').hidden = false;
    render(d);
  } catch (e) { $('msg').textContent = '불러오지 못했습니다. 잠시 뒤 다시 눌러 주세요. (' + e.message + ')'; }
}
$('gate').addEventListener('submit', ev => { ev.preventDefault(); const v = $('code').value; if (v) load(v, true); });
$('reload').addEventListener('click', () => { const c = store.get(); if (c) load(c, false); });
$('forget').addEventListener('click', () => { store.clear(); $('board').hidden = true; $('tools').hidden = true; $('gate').hidden = false; $('code').value = ''; $('msg').textContent = '이 기기에서 암호를 지웠습니다.'; $('stamp').textContent = '암호를 넣으면 지금까지 쌓인 결과가 보입니다.'; });
const saved = store.get(); if (saved) load(saved, false);
</script>
</body>
</html>
