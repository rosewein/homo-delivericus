<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>문 앞까지</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@600;700&display=swap">
<style>
/* 레이아웃: 휴대폰 한 손 폭의 세로 한 단. 위에는 지나온 길, 가운데는 그림 한 장과 장면 카드, 끝은 운송장 한 장. */
:root{
  --paper:#F2F1EF; --surface:#FBFAF9; --ink:#231F20; --muted:#5E5A5B; --line:#CBC7C7;
  --rasp:#A83D5F; --on-rasp:#FFFFFF; --box:#ACA9AA; --night:#2A2526; --moon:#F2F1EF;
  --sans:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans CJK KR',sans-serif;
  --serif:'Noto Serif KR','AppleMyungjo','Batang','Noto Serif CJK KR',serif;
  --mono:'IBM Plex Mono','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1A1718; --surface:#252122; --ink:#EFEDEA; --muted:#ABA6A7; --line:#443E40;
    --rasp:#E0779A; --on-rasp:#1A1718; --box:#6F6A6B; --night:#0E0C0D; --moon:#EFEDEA; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1A1718; --surface:#252122; --ink:#EFEDEA; --muted:#ABA6A7; --line:#443E40;
  --rasp:#E0779A; --on-rasp:#1A1718; --box:#6F6A6B; --night:#0E0C0D; --moon:#EFEDEA; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.65;word-break:keep-all;overflow-wrap:anywhere}
#app{display:flex;flex-direction:column;gap:16px}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 56px;display:flex;flex-direction:column;gap:20px}
h1,h2,p,ol,ul,figure{margin:0}
h1,h2{text-wrap:balance}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--rasp);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:.02em}

/* 위쪽 막대와 지나온 길 */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:2px solid var(--ink);margin-inline:-16px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.bar-name{font-weight:900;font-size:15px;letter-spacing:.02em}
.bar-side{font-size:13px}
.steps{display:grid;gap:4px}
.step{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12.5px;font-weight:700;color:var(--muted);text-align:center;line-height:1.3}
.step i{display:block;width:100%;height:6px;border-radius:3px;background:var(--line)}
.step.done{color:var(--ink)} .step.done i{background:var(--ink)}
.step.now{color:var(--rasp)} .step.now i{background:var(--rasp)}

/* 처음 화면 */
.intro{display:flex;flex-direction:column;gap:22px;padding-top:28px}
.eyebrow{font-family:var(--mono);font-size:12.5px;color:var(--muted);letter-spacing:.04em}
.intro h1{font-size:clamp(44px,13vw,62px);font-weight:900;line-height:1.12;letter-spacing:-.02em}
.intro h1 em{font-style:normal;color:var(--rasp)}
.hook{font-size:clamp(19px,5.6vw,23px);font-weight:900;line-height:1.35;text-wrap:balance}
.lead{font-size:17px}
.pick-h{font-weight:900;font-size:17px}
.pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pick button{display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:10px 12px 12px;border:2px solid var(--ink);border-radius:14px;background:var(--surface);cursor:pointer;text-align:left;transition:transform .12s}
.pick button:hover{transform:translateY(-2px)}
.pick button:active{transform:translateY(1px)}
.pick b{font-weight:900;font-size:16px;line-height:1.3}
.pick span{font-size:13px;color:var(--muted);line-height:1.4}
.pick .been{color:var(--rasp);font-weight:700}
.fact{display:flex;flex-direction:column;gap:4px;padding-block:14px;border-block:2px dashed var(--line)}
.fact b{font-weight:900}
.src{font-family:var(--mono);font-size:12.5px;color:var(--muted)}

/* 그림 */
.fig{line-height:0}
.art{display:block;width:100%;height:auto;border-radius:10px;background:var(--paper);border:1.5px solid var(--line)}
.pick .art{border:0;background:transparent}

/* 장면 카드 */
.card{border:2px solid var(--ink);border-radius:16px;background:var(--surface);display:flex;flex-direction:column}
.card.me{border-color:var(--rasp);border-width:4px}
.card-main{padding:18px;display:flex;flex-direction:column;gap:14px}
.stamp{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px;color:var(--muted)}
.card.me .stamp span:last-child{color:var(--rasp);font-weight:700}
.card h2{font-size:26px;font-weight:900;line-height:1.25;letter-spacing:-.01em}
.who{font-size:14px;font-weight:700;color:var(--rasp);margin-bottom:-4px}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;align-items:center;width:100%;text-align:left;min-height:56px;padding:12px 14px;border:2px solid var(--ink);border-radius:12px;background:var(--paper);cursor:pointer;font-weight:700;transition:transform .12s}
.choice:hover{transform:translateY(-1px)}
.choice:active{transform:translateY(1px)}
.choice.one{justify-content:center;background:var(--rasp);border-color:var(--rasp);color:var(--on-rasp);font-weight:900;font-size:20px;min-height:64px}
.row{display:flex;flex-wrap:wrap;gap:10px}
.btn{min-height:46px;padding:10px 18px;border:2px solid var(--ink);border-radius:12px;background:var(--ink);color:var(--paper);font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.link{border:0;background:none;padding:10px 0;min-height:44px;cursor:pointer;font-weight:700;color:var(--rasp);text-decoration:underline;text-underline-offset:3px}
a.link{display:inline-flex;align-items:center}
.picked{font-weight:700}
.picked::before{content:"→ ";color:var(--rasp)}

/* 결과: 운송장 */
.bill{border:6px solid var(--rasp);border-radius:20px;background:var(--surface);padding:20px 18px;display:flex;flex-direction:column;gap:16px}
.bill-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-weight:900;letter-spacing:.04em;font-size:14px;padding-bottom:10px;border-bottom:3px solid var(--rasp)}
.bill-top span:last-child{color:var(--rasp)}
.verdict{display:flex;flex-direction:column;gap:12px}
.bill h2{font-size:19px;font-weight:900;line-height:1.35}
.sent{font-size:clamp(22px,6.4vw,28px);font-weight:900;line-height:1.38;text-wrap:balance}
.sent em{font-style:normal;color:var(--rasp)}
.crowd{font-size:15px;font-weight:700;color:var(--rasp)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.stat{display:flex;flex-direction:column;gap:0;border-top:2px solid var(--ink);padding-top:6px}
.stat span{font-size:13px;color:var(--muted)}
.stat b{font-family:var(--mono);font-size:30px;line-height:1.2;font-weight:500}
.stat b small{font-family:var(--sans);font-size:14px;font-weight:700;margin:0 4px 0 2px}
.trace{display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:2px dashed var(--line)}
.trace-h{font-weight:900;font-size:14px}
.trace ol,.trace ul{list-style:none;padding:0;display:flex;flex-direction:column;gap:4px;font-size:15px}
.trace ol{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 12px}
.trace ol li{display:contents}
.trace ol li span{color:var(--muted)}
.trace.unseen .trace-h{color:var(--rasp)}
.trace ul li{display:grid;grid-template-columns:1em minmax(0,1fr);gap:6px;font-weight:700}
.trace ul li::before{content:"·";color:var(--rasp);font-weight:900}
.after{display:flex;flex-direction:column;gap:6px;font-size:17px;font-weight:700;padding-top:14px;border-top:2px dashed var(--line)}
.after .src{font-weight:500;white-space:nowrap}
.ask{font-family:var(--serif);font-weight:700;font-size:clamp(23px,6.8vw,29px);line-height:1.4;text-wrap:balance}
.rx{display:flex;flex-direction:column;gap:8px;padding:16px;border:2px solid var(--ink);border-radius:12px;background:var(--paper)}
.rx-h{font-weight:900;font-size:14px;color:var(--rasp);letter-spacing:.02em}
.rx-t{font-size:clamp(22px,6.4vw,28px);font-weight:900;line-height:1.3;text-wrap:balance}
.half b{display:block;font-weight:900;margin-bottom:4px}
.buy{display:flex;flex-direction:column;gap:10px}
.buy-h{font-weight:900;font-size:17px}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.buy a.btn{flex:1 1 90px;padding-inline:8px;white-space:nowrap}
.acts{display:flex;flex-direction:column;gap:10px}
.acts .row .btn{flex:1 1 90px}
.acts .again{align-self:center}
.bill-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-top:12px;border-top:2px dashed var(--line)}
.title-line{font-size:14px;line-height:1.5}
.title-line b{display:block;font-size:17px;font-weight:900;color:var(--rasp)}
.caution{flex:none;border:2.5px solid var(--rasp);color:var(--rasp);font-weight:900;font-size:13px;padding:3px 9px;border-radius:5px;transform:rotate(-3deg)}
.bc{height:34px;background:repeating-linear-gradient(90deg,var(--ink) 0 3px,transparent 3px 5px,var(--ink) 5px 6px,transparent 6px 10px,var(--ink) 10px 14px,transparent 14px 16px,var(--ink) 16px 17px,transparent 17px 21px)}
.shot img{display:block;width:100%;border-radius:12px;border:2px solid var(--line)}
.note{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.toast{font-size:14px;font-weight:700;color:var(--rasp);min-height:1.65em}
@media (prefers-reduced-motion: reduce){
  .choice,.pick button{transition:none}
}
</style>
</head>
<body>
<div class="wrap">
  <div id="app" aria-live="polite"></div>
  <p class="note">김철민의 책 『호모 딜리버리쿠스』(홀리데이북스)를 바탕으로 만든 실험입니다. 장면은 지어낸 이야기입니다.<span id="collect" hidden> 결과는 이름 없이 숫자로만 모읍니다.</span></p>
</div>

<script>
/*CORE-START*/
const D = 1440, hm = (d, h, m) => d * D + h * 60 + m;
const clock = t => { const x = ((t % D) + D) % D; return `${String(Math.floor(x / 60)).padStart(2, '0')}:${String(x % 60).padStart(2, '0')}`; };
const span = m => (m >= 60 ? `${Math.floor(m / 60)}시간${m % 60 ? ` ${m % 60}분` : ''}` : `${m}분`);
const STAR = { s5: 5, s4: 4, s3: 3, s1: 1, s0: 0 };
const STAR_WORD = { 5: '다섯', 4: '네', 3: '세', 1: '한' };
const starPick = (n, last) => ({ id: 's' + n, label: n ? `별 ${STAR_WORD[n]} 개를 누른다` : last,
  out: n ? `별 ${STAR_WORD[n]} 개가 채워진다. “소중한 평가 감사합니다.”` : null });

const ROUTES = {
  box: {
    id: 'box', name: '택배 상자', was: '였다', into: '택배 상자가', sub: '내일 도착', icon: 'iBox', days: true,
    steps: ['주문', '밤길', '택배 차', '주차장', '문 앞'], order: hm(0, 21, 40), doorArt: 'door',
    track: s => [[hm(0, 21, 40), '주문 접수'], [hm(0, 23, 50), '이동 중'], [arrive(s), '배송 완료']],
    scenes: [
      { step: 0, at: hm(0, 21, 40), where: '물류센터', title: '운송장', art: 'pack', hands: ['담는 손'], go: '실린다',
        body: '누군가 결제 버튼을 눌렀다. 손 하나가 책 한 권을 당신 안에 넣고 테이프를 두른다. 옆구리에 운송장이 붙는다. 이제 당신은 이름 대신 번호로 불린다.' },
      { step: 1, at: hm(0, 23, 50), where: '화물 트럭', title: '밤길', art: 'truck', hands: ['싣는 손'], go: '내려진다',
        body: '다른 상자들 틈에 끼어 트럭에 쌓인다. 문이 닫히고 캄캄해진다. 밤새 흔들린다. 어디를 지나는지 당신은 모른다.' },
      { step: 2, at: hm(1, 12, 40), where: '택배 차', title: '200개 중 하나', art: 'van', hands: ['택배 기사'], who: '택배 기사가',
        body: '아침에 택배 기사의 차로 옮겨졌다. 오늘 이 차가 돌아야 할 상자는 200개쯤, 도는 순서는 단말기가 정했다. 지금 남은 것은 121개. 기사가 운전석에서 김밥 한 줄을 푼다.',
        choices: [
          { id: 'eat', label: '기사는 김밥을 다 먹고 출발한다', late: 10, unseen: '김밥 한 줄을 다 먹는 데 쓴 10분',
            out: '10분이 지난다. 단말기의 숫자는 그대로 121이다. 기사가 시동을 건다.' },
          { id: 'go', label: '기사는 두 개만 집어 먹고 출발한다', unseen: '조수석에 남은 김밥 여덟 개',
            out: '남은 김밥이 조수석에 놓인다. 차가 움직인다. 다음 집 앞에서 숫자가 120이 된다.' }
        ] },
      { step: 3, at: hm(1, 14, 20), drift: true, where: '아파트 지하 주차장', title: '지하 주차장', art: 'cart', who: '택배 기사가',
        body: '이 단지는 택배 차가 지상으로 다닐 수 없다. 기사는 지하에서 당신을 카트에 옮겨 싣는다. 바퀴 소리가 주차장에 울린다. 엘리베이터는 17층에 서 있다. 당신은 4층으로 간다.',
        choices: [
          { id: 'lift', label: '기사는 엘리베이터를 기다린다', late: 6, unseen: '엘리베이터 앞에서 기다린 6분',
            out: '17, 16, 15. 숫자가 층마다 멈추며 내려온다. 기사는 단말기를 들여다본다.' },
          { id: 'stairs', label: '기사는 당신을 안고 계단으로 오른다', unseen: '상자를 안고 걸어 오른 4층 계단', set: { stairs: 1 },
            out: '한 층, 두 층. 숨소리가 가까이에서 들린다. 당신은 그의 팔 안에서 흔들린다.' }
        ] },
      { step: 4, at: hm(1, 14, 26), drift: true, arrive: true, where: '4층 복도', title: '문 앞', art: 'door', go: '문 안쪽으로',
        body: '기사가 당신을 문 앞에 내려놓는다. 찰칵, 사진을 찍는다. 발소리가 멀어진다. 그에게는 아직 백 개쯤 되는 상자가 남아 있다.' },
      { step: 4, at: hm(1, 14, 26), drift: true, me: true, final: true, where: '문 안쪽', title: '문자 한 통', art: 'msg',
        body: '이제 당신은 그 상자를 주문한 사람이다. 휴대폰에 문자가 와 있다. “문 앞에 놓고 갔습니다.” 복도에서 발소리가 아직 들린다.',
        choices: [
          { id: 'open', label: '문을 열고 “수고하셨습니다” 하고 말한다', seen: 1,
            out: '문을 연다. 기사가 돌아본다. “수고하셨습니다.” 그가 고개를 숙이고 다시 걷는다. 3초쯤 걸렸다.' },
          { id: 'later', label: '문자만 확인한다. 상자는 이따가 들인다',
            out: '화면을 끈다. 발소리가 사라진다. 상자는 저녁까지 문 앞에 있다.' }
        ] }
    ]
  },
  dawn: {
    id: 'dawn', name: '새벽배송 우유', was: '였다', into: '새벽배송 우유가', sub: '아침 7시 전 도착', icon: 'iMilk', days: true,
    steps: ['주문', '캠프', '공동현관', '문 앞'], order: hm(0, 22, 58), doorArt: 'doorbag',
    track: s => [[hm(0, 22, 58), '주문 접수'], [hm(1, 1, 30), '캠프 도착'], [arrive(s), '배송 완료']],
    scenes: [
      { step: 0, at: hm(0, 22, 58), where: '물류센터', title: '마감 2분 전', art: 'shelf', hands: ['집는 손'], go: '옮겨진다',
        body: '밤 11시 마감을 2분 남기고 주문이 들어왔다. 축구장 수십 개만 한 물류센터, 수십만 가지 물건 사이에서 손 하나가 당신을 집는다. 계란, 빵과 함께 보냉가방에 담긴다.' },
      { step: 1, at: hm(1, 1, 30), where: '캠프', title: '캠프', art: 'camp', hands: ['나누는 손'], go: '실린다',

function fresh() { return { phase: 'intro', route: null, i: 0, pick: null, late: 0, hands: [], unseen: [], flags: {}, picks: [], final: null, seen: 0 }; }
const val = (v, s) => (typeof v === 'function' ? v(s) : v);

function enter(s, i) {
  s.i = i; s.pick = null;

  s.t0 = sc.at + (sc.drift ? s.late : 0);
  for (const h of sc.hands || []) if (!s.hands.includes(h)) s.hands.push(h);
  for (const u of val(sc.unseen, s) || []) s.unseen.push(u);

  Object.assign(s.flags, c.set || {});
  s.picks.push(c.id);
  if (sc.final) { s.final = c.id; s.seen = c.seen || 0; }
}
const at = (s, sc = scene(s)) => sc.at + (sc.drift ? s.late : 0);

  const list = route(s).scenes, now = chooser(list[s.i]);

}

  const s = state;
  app.innerHTML = s.phase === 'intro' ? viewIntro() : s.phase === 'result' ? viewResult(s) : viewScene(s);
  if (s.phase === 'result') { BEEN.add(s.route); prepareCard(); askCrowd(); mark('done'); } else CARD = null;
  if (s.phase === 'intro') askTotal();
  if (focus) {
    window.scrollTo(0, 0);
    const h = app.querySelector('h1,h2');
    if (h) h.focus({ preventScroll: true });
  }
}

app.addEventListener('click', ev => {
  const st = ev.target.closest('a[data-store]');
  if (st && sbOn()) sbCall('bx_click', { p_store: st.dataset.store }).catch(() => {});
  const b = ev.target.closest('[data-act]');
  if (!b) return;
  const s = state, act = b.dataset.act;
  if (act === 'route') { begin(s, b.dataset.id); render(true);
  } else if (act === 'pick') {
    if (s.phase !== 'scene') return;
    const c = options(s).find(x => x.id === b.dataset.id);
    if (!c) return;
    choose(s, c); s.pick = c.id; s.phase = 'outcome'; render(true);
  } else if (act === 'next') {
    if (scene(s).final && s.phase === 'outcome') s.phase = 'result';
    else { s.phase = 'scene'; enter(s, s.i + 1); }
    render(true);
  } else if (act === 'again') { state = fresh(); render(true);
  } else if (act === 'save') { saveCard();
  } else if (act === 'share') {
    const toast = document.getElementById('toast'), text = `${shareLine(s)}\n${SITE}`;
    const manual = () => { toast.textContent = text; };
    if (canShare()) { try { navigator.share({ title: '문 앞까지', text: shareLine(s), url: SITE }).catch(() => {}); } catch (e) { manual(); } }
    else { try { navigator.clipboard.writeText(text).then(() => { toast.textContent = '결과 문구와 링크를 복사했습니다. 붙여 넣어 공유해 주세요.'; }, manual); } catch (e) { manual(); } }
  }
});

function start(data) {
  const col = document.getElementById('collect'); if (col && sbOn()) col.hidden = false;
  mark('visit');
  if (data && data.state && data.state.phase) state = data.state;
  render(false);
}
try { window.claude?.hot?.snapshot?.(() => ({ state })); } catch (e) {}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
