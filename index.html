<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>배송 없는 일주일</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@600;700&display=swap">
<style>
/* 레이아웃: 휴대폰 한 손 폭의 세로 한 단. 위에는 늘 스위치, 가운데는 장면 카드, 끝은 운송장 한 장. */
:root{
  --paper:#F2F1EF; --surface:#FBFAF9; --ink:#231F20; --muted:#5E5A5B; --line:#CBC7C7;
  --rasp:#A83D5F; --on-rasp:#FFFFFF; --box:#ACA9AA; --off:#B9B5B6; --knob:#FFFFFF;
  --sans:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans CJK KR',sans-serif;
  --serif:'Noto Serif KR','AppleMyungjo','Batang','Noto Serif CJK KR',serif;
  --mono:'IBM Plex Mono','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1A1718; --surface:#252122; --ink:#EFEDEA; --muted:#ABA6A7; --line:#443E40;
    --rasp:#E0779A; --on-rasp:#1A1718; --box:#6F6A6B; --off:#575153; --knob:#EFEDEA; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1A1718; --surface:#252122; --ink:#EFEDEA; --muted:#ABA6A7; --line:#443E40;
  --rasp:#E0779A; --on-rasp:#1A1718; --box:#6F6A6B; --off:#575153; --knob:#EFEDEA; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.65;word-break:keep-all;overflow-wrap:anywhere}
#app{display:flex;flex-direction:column;gap:16px}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 56px;display:flex;flex-direction:column;gap:20px}
h1,h2,p{margin:0}
h1,h2{text-wrap:balance}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--rasp);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:.02em}

/* 위쪽 막대 */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:2px solid var(--ink);margin-inline:-16px;padding:8px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.bar-name{font-weight:900;font-size:15px;letter-spacing:.02em}
.sw:disabled{cursor:default;color:inherit}
.sw{display:inline-flex;align-items:center;gap:10px;border:0;background:none;cursor:pointer;padding:6px 0;min-height:44px}
.sw-label{font-family:var(--mono);font-size:13px}
.sw-track{flex:none;width:52px;height:28px;border-radius:999px;background:var(--off);position:relative;transition:background .25s}
.sw-knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--knob);transition:transform .25s}
.sw[aria-checked="true"] .sw-track{background:var(--rasp)}
.sw[aria-checked="true"] .sw-knob{transform:translateX(24px)}
.sw.big{flex-direction:column;gap:14px;padding:0}
.sw.big .sw-track{width:136px;height:72px}
.sw.big .sw-knob{top:7px;left:7px;width:58px;height:58px}
.sw.big[aria-checked="true"] .sw-knob{transform:translateX(64px)}
.sw.big .sw-label{font-size:15px}

/* 처음 화면 */
.intro{display:flex;flex-direction:column;gap:22px;padding-top:28px}
.eyebrow{font-family:var(--mono);font-size:12.5px;color:var(--muted);letter-spacing:.04em}
.intro h1{font-size:clamp(40px,12vw,58px);font-weight:900;line-height:1.12;letter-spacing:-.02em}
.intro h1 em{font-style:normal;color:var(--rasp)}
.hook{font-size:clamp(19px,5.6vw,23px);font-weight:900;line-height:1.35;text-wrap:balance}
.lead{font-size:17px}
.hero-sw{display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px 16px;border:2px solid var(--ink);border-radius:16px;background:var(--surface)}
.hero-hint{font-size:14px;color:var(--muted)}
.fact{display:flex;flex-direction:column;gap:4px;padding-block:14px;border-block:2px dashed var(--line)}
.fact b{font-weight:900}
.src{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.rules{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;font-size:15px}
.rules li{display:grid;grid-template-columns:3.4em minmax(0,1fr);gap:10px}
.rules b{font-weight:900}

/* 요일 띠와 계기 */
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.day{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:13px;font-weight:700;color:var(--muted)}
.day i{display:block;width:100%;height:6px;border-radius:3px;background:var(--line)}
.day.done{color:var(--ink)} .day.done i{background:var(--ink)}
.day.now{color:var(--rasp)} .day.now i{background:var(--rasp)}
.meters{display:flex;flex-direction:column;gap:8px}
.meter{display:grid;grid-template-columns:2.6em minmax(0,1fr) 1.6em;align-items:center;gap:10px;font-size:14px;font-weight:700}
.segs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.segs i{height:11px;border-radius:2px;background:var(--line)}
.segs i.f{background:var(--ink)}
.meter.low .segs i.f{background:var(--rasp)}
.meter.low .num{color:var(--rasp)}
.num{text-align:right}

/* 장면 카드 */
.card{border:2px solid var(--ink);border-radius:16px;background:var(--surface);display:flex;flex-direction:column}
.card-main{padding:20px 18px;display:flex;flex-direction:column;gap:14px}
.stamp{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px;color:var(--muted)}
.card h2{font-size:26px;font-weight:900;line-height:1.25;letter-spacing:-.01em}
.bonus{font-size:14px;font-weight:700;color:var(--rasp)}
.sign{font-size:15px;color:var(--muted);font-weight:700}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:6px;width:100%;text-align:left;min-height:56px;padding:12px 14px;border:2px solid var(--ink);border-radius:12px;background:var(--paper);cursor:pointer;font-weight:700;transition:transform .12s}
.choice:hover{transform:translateY(-1px)}
.choice:active{transform:translateY(1px)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--mono);font-size:12.5px;padding:1px 7px;border:1.5px solid var(--line);border-radius:999px;color:var(--muted);font-weight:500}
.chip.up{color:var(--ink);border-color:var(--ink)}
.chip.danger{color:var(--on-rasp);background:var(--rasp);border-color:var(--rasp)}
.tempt{border-top:2px dashed var(--line);padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.tempt span{min-width:0;flex:1 1 220px}
.link{border:0;background:none;padding:10px 0;min-height:44px;cursor:pointer;font-weight:700;color:var(--rasp);text-decoration:underline;text-underline-offset:3px}
.confirm{border-top:2px dashed var(--line);padding:14px 18px;display:flex;flex-direction:column;gap:10px;font-size:15px}
.row{display:flex;flex-wrap:wrap;gap:10px}
.btn{min-height:46px;padding:10px 18px;border:2px solid var(--ink);border-radius:12px;background:var(--ink);color:var(--paper);font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.rasp{background:var(--rasp);border-color:var(--rasp);color:var(--on-rasp)}
.picked{font-weight:700}
.picked::before{content:"→ ";color:var(--rasp)}
.book{display:flex;flex-direction:column;gap:8px;padding-block:14px;border-block:2px dashed var(--line)}
.book q,.book .q{font-family:var(--serif);font-weight:700;font-size:19px;line-height:1.6;quotes:none}

/* 결과: 운송장 */
.bill{border:6px solid var(--rasp);border-radius:20px;background:var(--surface);padding:20px 18px;display:flex;flex-direction:column;gap:16px}
.bill-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-weight:900;letter-spacing:.04em;font-size:14px;padding-bottom:10px;border-bottom:3px solid var(--rasp)}
.bill-top span:last-child{color:var(--rasp)}
.to{display:grid;grid-template-columns:4.2em minmax(0,1fr);gap:4px 12px;font-size:14px;padding-bottom:14px;border-bottom:2px dashed var(--line)}
.to dt{color:var(--muted)} .to dd{margin:0;font-weight:700}
.to dd.hl{color:var(--rasp);font-weight:900}
.verdict{display:flex;flex-direction:column;gap:8px}
.bill h2{font-size:19px;font-weight:900;line-height:1.35}
.pct{display:flex;align-items:baseline;gap:4px;color:var(--rasp);font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.pct b{font-size:clamp(88px,31vw,132px);font-weight:900;letter-spacing:-.04em}
.pct span{font-size:clamp(36px,12vw,52px)}
.gauge{height:12px;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--paper)}
.gauge i{display:block;height:100%;background:var(--rasp)}
.tier{font-size:clamp(22px,6.4vw,28px);font-weight:900;line-height:1.3}
.sent{font-size:clamp(19px,5.4vw,23px);font-weight:900;line-height:1.4;padding-top:14px;border-top:2px dashed var(--line)}
.calc{font-size:12px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.stat{display:flex;flex-direction:column;gap:0;border-top:2px solid var(--ink);padding-top:6px}
.stat span{font-size:13px;color:var(--muted)}
.stat b{font-family:var(--mono);font-size:30px;line-height:1.2;font-weight:500}
.stat b small{font-family:var(--sans);font-size:14px;font-weight:700;margin-left:2px}
.lacks{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px}
.lacks .chip{font-family:var(--sans);font-size:13px;color:var(--ink);border-color:var(--ink)}
.door{display:flex;flex-direction:column;gap:6px}
.door-floor{height:64px;border-bottom:3px solid var(--ink);display:flex;align-items:flex-end;gap:6px;padding-inline:10px;overflow:hidden}
.bx{width:46px;height:36px;border:2px solid var(--ink);border-radius:3px;background:var(--box);position:relative;animation:drop .55s cubic-bezier(.3,1.3,.5,1) both}
.bx::after{content:"";position:absolute;left:0;right:0;top:9px;height:6px;background:var(--rasp)}
.bx:nth-child(2){width:58px;height:46px;animation-delay:.18s}
.bx:nth-child(3){width:38px;height:28px;animation-delay:.36s}
@keyframes drop{from{transform:translateY(-90px)}to{transform:translateY(0)}}
.door-cap{font-size:13px;color:var(--muted)}
.ask{font-family:var(--serif);font-weight:700;font-size:clamp(24px,7vw,30px);line-height:1.4}
.rx{display:flex;flex-direction:column;gap:8px;padding:16px;border:2px solid var(--ink);border-radius:12px;background:var(--paper)}
.rx-h{font-weight:900;font-size:14px;color:var(--rasp);letter-spacing:.02em}
.rx-t{font-size:clamp(22px,6.4vw,28px);font-weight:900;line-height:1.3;text-wrap:balance}
.rx-t .mono{display:block;font-size:15px;font-weight:500;color:var(--muted)}
.half b{display:block;font-weight:900;margin-bottom:4px}
.buy{display:flex;flex-direction:column;gap:10px}
.buy-h{font-weight:900;font-size:17px}
.buy a.btn{display:inline-flex;align-items:center;justify-content:center;flex:1 1 90px;text-decoration:none}
.bill-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-top:12px;border-top:2px dashed var(--line)}
.title-line{font-size:14px;line-height:1.5}
.title-line b{display:block;font-size:17px;font-weight:900;color:var(--rasp)}
.caution{flex:none;border:2.5px solid var(--rasp);color:var(--rasp);font-weight:900;font-size:13px;padding:3px 9px;border-radius:5px;transform:rotate(-3deg)}
.bc{height:34px;background:repeating-linear-gradient(90deg,var(--ink) 0 3px,transparent 3px 5px,var(--ink) 5px 6px,transparent 6px 10px,var(--ink) 10px 14px,transparent 14px 16px,var(--ink) 16px 17px,transparent 17px 21px)}
.shot img{display:block;width:100%;border-radius:12px;border:2px solid var(--line)}
.note{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.toast{font-size:14px;font-weight:700;color:var(--rasp);min-height:1.65em}
@media (prefers-reduced-motion: reduce){
  .sw-track,.sw-knob,.choice{transition:none}
  .bx{animation:none}
}
</style>
</head>

</div>

<script>

const SCENES = [
  { d: 0, time: '07:00', title: '빈 현관', key: '빈 현관',

      { label: '달걀 두 알을 부쳐 먹고 나간다', fx: { M: -1 },
        out: '냉장고가 정말로 비었다. 저녁에 먹을 게 없다는 생각이 지하철까지 따라온다.' }

  { d: 0, time: '19:30', title: '퇴근길', key: '장보기',

    choices: [

        out: '양손에 봉투를 들고 걷는다. 손가락에 비닐 자국이 남는다. 냉장고가 찼다.' },
      { label: '집 앞 가게에서 오늘 저녁거리만 산다', fx: { T: -1, E: -1 }, visit: 1, people: 1,
        out: '두부 한 모와 대파 한 단. 가게 주인이 대파를 반으로 접어 봉투에 넣어 준다. 내일 일은 내일 생각하기로 한다.' },
      { label: '집에 있는 것으로 버틴다', fx: { M: -1 }, lack: '장보기',

  { d: 1, time: '08:10', title: '마지막 한 롤', key: '휴지',
    body: '화장실 휴지가 한 롤 남았다. 서른 롤짜리 묶음은 늘 문 앞까지 왔다.',
    tempt: '지금 주문하면 서른 롤이 내일 도착합니다.',

      { label: '점심시간에 사서 사무실로 들고 온다', fx: { T: -1, E: -1 }, visit: 1, people: 1,

function available(s, sc) { return sc.choices.filter(c => !c.needStock || s.stock); }
function after(s, c) {
  const v = {};
  for (const k of ['T', 'E', 'M']) v[k] = Math.min(MAX, s[k] + (c.fx[k] || 0));
  return v;
}
function emptied(v) { return ['E', 'T', 'M'].find(k => v[k] <= 0) || null; }
function choose(s, c) {
  const v = after(s, c);
  s.T = v.T; s.E = v.E; s.M = v.M;
  s.visits += c.visit || 0; s.people += c.people || 0;
  if (c.lack) s.lacks.push(c.lack);
  if (c.stock) s.stock = true;
  if (c.flag) (s.flags = s.flags || []).push(c.flag);
  const low = Math.min(v.T, v.E, v.M);
  if (!s.tight || low < s.tight.v) s.tight = { i: s.i, v: low };
  return emptied(v);
}
function enter(s, i) {
  s.i = i;

  if (e.type === 'forced') return `나는 ${day}요일, ${WHY[e.meter][0]} 결국 주문했다.`;
  return `나는 배송 없이 일주일을 버텼다. ${FINALS.find(f => f.id === e.final).tail}`;
}

const SCENE_CH = [1, 3, 13, 14, 12, 4, 28, 5, 15];
const METER_CH = { M: 13, T: 5, E: 28 };
function rx(s) {

    <div class="bill-foot"><p class="title-line"><b>호모 딜리버리쿠스</b>배송 문명은 어떻게 우리를 바꿨는가<br>김철민 지음 · 홀리데이북스</p><span class="caution">취급주의</span></div>
  </section>
  <div class="row"><button class="btn" data-act="save">결과 이미지 저장</button><button class="btn ghost" data-act="again">처음부터 다시</button></div>
  <p class="toast" id="toast"></p>
  <div class="shot" id="shot" hidden></div>`;
}

/* 결과 이미지(1080×1350): 화면과 별개로 캔버스에 직접 그려, 어디서 열어도 같은 그림이 나오게 한다. */
const IMG = { paper: '#F2F1EF', ink: '#231F20', rasp: '#A83D5F', muted: '#5E5A5B', box: '#ACA9AA', line: '#BDB9BA' };
const FONT = (w, px) => `${w} ${px}px "Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans CJK KR",sans-serif`;
function wrapLines(g, text, maxW) {
  const out = []; let cur = '';
  for (const w of text.split(' ')) {
    const t = cur ? cur + ' ' + w : w;
    if (!cur || g.measureText(t).width <= maxW) cur = t; else { out.push(cur); cur = w; }
  }
  if (cur) out.push(cur);
  return out;
}
function roundRect(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
async function makeCard(s) {
  const W = 1080, H = 1350, c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d'), pct = score(s), r = rx(s), n = survived(s);
  const sent = headline(s), chap = `${r.ch}장 ${r.title}`;
  try { await Promise.all([900, 700, 500].map(w => document.fonts.load(FONT(w, 40), sent + chap + tier(pct) + '당신나의배송의존도호모딜리버리쿠스에게된쪽부터김철민지음홀리데이북스없는일주일취급주의'))); } catch (e) {}
  g.fillStyle = IMG.box; g.fillRect(0, 0, W, H);
  roundRect(g, 54, 54, W - 108, H - 108, 34); g.fillStyle = IMG.paper; g.fill(); g.lineWidth = 12; g.strokeStyle = IMG.rasp; g.stroke();
  const L = 118, R = W - 118, IW = R - L; let y = 152;
  const dash = yy => { g.save(); g.setLineDash([14, 10]); g.lineWidth = 3; g.strokeStyle = IMG.line; g.beginPath(); g.moveTo(L, yy); g.lineTo(R, yy); g.stroke(); g.restore(); };
  g.textBaseline = 'alphabetic'; g.textAlign = 'left';
  g.fillStyle = IMG.ink; g.font = FONT(900, 30); g.fillText('HOMO DELIVERICUS', L, y);
  g.fillStyle = IMG.rasp; g.textAlign = 'right'; g.fillText(`${n} / 7`, R, y); g.textAlign = 'left';
  g.fillRect(L, y + 20, IW, 6);
  y += 104; g.fillStyle = IMG.ink; g.font = FONT(900, 44); g.fillText('배송 없는 일주일 · 나의 배송 의존도', L, y);
  y += 262; g.fillStyle = IMG.rasp; g.font = FONT(900, 290); const num = String(pct); g.fillText(num, L - 14, y);
  const nw = g.measureText(num).width; g.font = FONT(900, 116); g.fillText('%', L - 14 + nw + 8, y);
  y += 40; roundRect(g, L, y, IW, 26, 13); g.fillStyle = '#FFFFFF'; g.fill();
  g.save(); roundRect(g, L, y, IW, 26, 13); g.clip(); g.fillStyle = IMG.rasp; g.fillRect(L, y, IW * pct / 100, 26); g.restore();
  roundRect(g, L, y, IW, 26, 13); g.lineWidth = 4; g.strokeStyle = IMG.ink; g.stroke();
  y += 104; g.fillStyle = IMG.ink; g.font = FONT(900, 60); g.fillText(tier(pct), L, y);
  y += 44; dash(y);
  g.font = FONT(700, 36); g.fillStyle = IMG.ink; y += 10;
  for (const ln of wrapLines(g, sent, IW)) { y += 52; g.fillText(ln, L, y); }
  y += 66; g.fillStyle = IMG.rasp; g.font = FONT(900, 28); g.fillText('당신에게 배송된 장', L, y);
  g.fillStyle = IMG.ink; g.font = FONT(900, 44); y += 8;
  for (const ln of wrapLines(g, chap, IW)) { y += 60; g.fillText(ln, L, y); }
  y += 44; g.fillStyle = IMG.muted; g.font = FONT(500, 26); g.fillText(`『호모 딜리버리쿠스』 ${r.page}쪽부터`, L, y);
  dash(1178);
  g.fillStyle = IMG.rasp; g.font = FONT(900, 36); g.fillText('호모 딜리버리쿠스', L, 1232);
  g.fillStyle = IMG.ink; g.font = FONT(500, 26); g.fillText('김철민 지음 · 홀리데이북스', L, 1270);
  g.fillStyle = IMG.muted; g.textAlign = 'right'; g.fillText('배송 없는 일주일', R, 1270); g.textAlign = 'left';
  g.save(); g.translate(R - 150, 1196); g.rotate(-0.05); roundRect(g, 0, 0, 150, 46, 7); g.lineWidth = 4; g.strokeStyle = IMG.rasp; g.stroke();
  g.fillStyle = IMG.rasp; g.font = FONT(900, 24); g.textAlign = 'center'; g.fillText('취급주의', 75, 33); g.restore();
  c._bottom = y;
  return c;
}

let CARD = null, DL = null;
try { const u = window.claude && window.claude.use && window.claude.use('downloads'); if (u) u.then(d => { DL = d; }, () => {}); } catch (e) {}
function prepareCard() {
  const s = state, job = { blob: null, name: `homo-delivericus-${score(s)}.png` };
  job.ready = makeCard(s).then(c => new Promise(res => c.toBlob(res, 'image/png'))).then(b => { job.blob = b; return b; }, () => null);
  CARD = job;
}
function showCard(job) {
  const holder = document.getElementById('shot');
  if (!holder || !job.blob) return null;
  if (!job.url) job.url = URL.createObjectURL(job.blob);
  holder.innerHTML = ''; const img = new Image(); img.alt = '결과 이미지'; img.src = job.url; holder.appendChild(img); holder.hidden = false;
  return job.url;
}
async function saveCard() {
  const toast = document.getElementById('toast'), job = CARD, hint = '아래 이미지를 길게 눌러 저장해 주세요.';
  if (!job) return;
  if (!job.blob) { toast.textContent = '이미지를 만드는 중입니다.'; await job.ready; }
  if (!job.blob) { toast.textContent = '이미지를 만들지 못했습니다. 화면을 캡처해 주세요.'; return; }
  const url = showCard(job);
  try {
    if (DL) { await DL.save({ filename: job.name, data: job.blob }); toast.textContent = '이미지를 저장했습니다.'; return; }
    if (!window.claude) {
      const file = new File([job.blob], job.name, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); toast.textContent = ''; return; }
      const a = document.createElement('a'); a.href = url; a.download = job.name; document.body.appendChild(a); a.click(); a.remove();
      toast.textContent = '이미지를 저장했습니다.'; return;
    }
    toast.textContent = hint;
  } catch (e) { toast.textContent = hint; }
}

function render(focus) {
  const s = state;
  app.innerHTML = s.phase === 'intro' ? viewIntro()
    : s.phase === 'final' ? viewFinal(s)
    : s.phase === 'result' ? viewResult(s) : viewScene(s);
  if (s.phase === 'result') prepareCard(); else CARD = null;
  if (focus) {
    window.scrollTo(0, 0);
    const h = app.querySelector('h1,h2');
    if (h) h.focus({ preventScroll: true });
  }
}

app.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]');
  if (!b) return;
  const s = state, act = b.dataset.act;
  if (act === 'start') {
    b.setAttribute('aria-checked', 'false');
    b.querySelector('.sw-label').textContent = '배송 OFF';
    b.disabled = true;
    const still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    setTimeout(() => { state = fresh(); state.phase = 'scene'; enter(state, 0); render(true); }, still ? 0 : 520);
  } else if (act === 'ask') {
    if ((s.phase === 'scene' || s.phase === 'outcome') && !s.end) {
      s.confirm = true; render(false);
      const y = app.querySelector('.confirm .btn');
      if (y) { y.focus(); y.scrollIntoView({ block: 'nearest' }); }
    }
  } else if (act === 'stay') { s.confirm = false; render(false);
  } else if (act === 'quit') { s.end = { type: 'quit', scene: s.i }; s.phase = 'result'; render(true);
  } else if (act === 'pick') {
    const c = SCENES[s.i].choices[+b.dataset.n];
    const gone = choose(s, c);
    s.pick = +b.dataset.n; s.confirm = false; s.phase = 'outcome';
    if (gone) s.end = { type: 'forced', scene: s.i, meter: gone };
    render(true);
  } else if (act === 'next') {
    if (s.end) s.phase = 'result';
    else if (s.i === SCENES.length - 1) s.phase = 'final';
    else { s.phase = 'scene'; s.pick = null; enter(s, s.i + 1); }
    render(true);
  } else if (act === 'final') { s.end = { type: 'done', final: b.dataset.id }; s.phase = 'result'; render(true);
  } else if (act === 'again') { state = fresh(); render(true);
  } else if (act === 'save') { saveCard();
  }
});

function start(data) {
  if (data && data.state && data.state.phase) state = data.state;
  render(false);
}
try { window.claude?.hot?.snapshot?.(() => ({ state })); } catch (e) {}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
